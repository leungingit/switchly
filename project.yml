name: Switchly
options:
  bundleIdPrefix: com.switchly
  deploymentTarget:
    macOS: "12.0"
  xcodeVersion: "26.0"
  settings:
    base:
      # Signing defaults live in Config/Base.xcconfig (attached below via
      # configFiles): ad-hoc by default so a fresh clone (and CI) builds with
      # zero setup. A local, git-ignored Config/Local.xcconfig can switch to a
      # stable identity — see Config/Local.xcconfig.example / CONTRIBUTING.md.
      # Command-line overrides still win, e.g.:
      #   make build SIGN_IDENTITY="Developer ID Application: Your Name (TEAMID)"
      CODE_SIGN_ENTITLEMENTS: Supporting/Switchly.entitlements
      ENABLE_HARDENED_RUNTIME: YES
      SWIFT_VERSION: "5.9"
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      SWIFT_EMIT_LOC_STRINGS: NO
      GCC_C_LANGUAGE_STANDARD: c11
      CLANG_CXX_LANGUAGE_STANDARD: gnu++17

packages:
  HotKey:
    url: https://github.com/soffes/HotKey.git
    from: "0.2.0"
  GLTFKit2:
    url: https://github.com/warrenm/GLTFKit2.git
    exactVersion: "0.5.15"

# Project-level xcconfig applied to every build configuration. It carries the
# committed signing defaults and includes the git-ignored Config/Local.xcconfig
# (when present), so a developer machine can use a stable, private signing
# identity without committing anything.
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

targets:
  SwitchlyCaptureProbe:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes: [App/SwitchlyApp.swift]
      - Tools/WindowCaptureProbe
      - path: Resources/en.lproj
        buildPhase: resources
      - path: Resources/zh-Hans.lproj
        buildPhase: resources
    dependencies:
      - package: HotKey
      - package: GLTFKit2
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.switchly.capture-validation
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
    scheme:
      gatherCoverageData: false

  Switchly:
    type: application
    platform: macOS
    sources:
      - Sources/App
      - Sources/Models
      - Sources/ViewModels
      - Sources/Views
      - Sources/Services
      - Sources/Utilities
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/en.lproj
        buildPhase: resources
      - path: Resources/zh-Hans.lproj
        buildPhase: resources
      # Built-in Dock preview plugins, copied as a folder reference so the
      # bundle keeps Contents/Resources/Plugins/<id>/ intact.
      - path: .build/Plugins
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.switchly.app
        PRODUCT_MODULE_NAME: Switchly
        PRODUCT_NAME: Switchly
        INFOPLIST_FILE: Resources/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: HotKey
      - package: GLTFKit2
    postBuildScripts:
      - name: Bundle offline MediaRemote Adapter
        basedOnDependencyAnalysis: false
        script: |
          python3 -B "${SRCROOT}/Scripts/mediaremote-adapter.py" embed --app "${TARGET_BUILD_DIR}/${WRAPPER_NAME}"
    entitlements:
      path: Supporting/Switchly.entitlements
      properties:
        # Hardened runtime blocks Apple Events without this; the built-in
        # Music plugin controls Music through host-owned AppleScript.
        com.apple.security.automation.apple-events: true
    # Generate a shared scheme so that `xcodebuild -scheme Switchly` works
    # deterministically (on CI, and for anyone who never opens Xcode). Without
    # this, the scheme only exists implicitly and `-scheme` depends on Xcode's
    # scheme autocreation.
    scheme:
      testTargets:
        - name: SwitchlyTests
        - name: SwitchlyUITests
          parallelizable: false
      gatherCoverageData: false

  SwitchlyTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/UnitTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Switchly.app/Contents/MacOS/Switchly"
    dependencies:
      - target: Switchly

  SwitchlyUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [Tests/UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Switchly

  # T04 build wiring only. These targets intentionally contain no host
  # resources, services, app lifecycle, or entitlements. The minimal entry
  # points live under Tools/PluginPreview/Entry until T06/T08 freeze their
  # real protocol and window implementations.
  SwitchlyPluginPreview:
    type: application
    platform: macOS
    dependencies:
      - target: SwitchlyPluginPreviewWorker
      - package: GLTFKit2
    postBuildScripts:
      - name: Bundle preview worker
        script: |
          cp "${BUILT_PRODUCTS_DIR}/SwitchlyPluginPreviewWorker" "${TARGET_BUILD_DIR}/${EXECUTABLE_FOLDER_PATH}/SwitchlyPluginPreviewWorker"
        inputFiles:
          - "$(BUILT_PRODUCTS_DIR)/SwitchlyPluginPreviewWorker"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/SwitchlyPluginPreviewWorker"
    sources:
      - Sources/Models/AppSettings.swift
      - Sources/Models/DockLayoutSpec.swift
      - Sources/Models/Enums/GridBackground.swift
      - Sources/Models/Enums/GridStyle.swift
      - Sources/Models/Enums/NotificationStrategy.swift
      - Sources/Models/Enums/PreviewHotspotEdge.swift
      - Sources/Models/Enums/PreviewStrategy.swift
      - Sources/Models/Enums/ShortcutPrefix.swift
      - Sources/Models/Enums/ThumbnailSize.swift
      - Sources/Models/MenuBarIcon.swift
      - Sources/Models/MonitoredApp.swift
      - Sources/Models/OnlineWeatherSettings.swift
      - Sources/Models/UsageStatistics.swift
      - Sources/Models/UsageStatisticsEfficiency.swift
      - Sources/Models/WindowInfo.swift
      - Sources/Models/Workspace.swift
      - Sources/Models/Plugins/PluginConsoleLine.swift
      - Sources/Models/Plugins/PluginGrant.swift
      - Sources/Models/Plugins/PluginManifest.swift
      - Sources/Models/Plugins/PluginScene.swift
      - Sources/Models/Plugins/PluginScene3DDescriptor.swift
      - Sources/Models/Plugins/PluginUINode.swift
      - Sources/Models/Plugins/SceneEvaluator.swift
      - Sources/Services/Plugins/PluginRegistry.swift
      - Sources/Services/Plugins/PluginPackageValidator.swift
      - Sources/Services/Plugins/GLBPreflight.swift
      # T04 dynamic surfaces used by scene3d screen nodes. The preview compiles
      # the same renderer, request model, signature and texture types as the
      # host instead of carrying a reduced copy.
      - Sources/Services/Plugins/PluginSurfaceRasterizing.swift
      - Sources/Services/Plugins/PluginSurfaceRenderer.swift
      - Sources/Services/Plugins/PluginSurfaceRequest.swift
      - Sources/Services/Plugins/PluginSurfaceSignature.swift
      - Sources/Services/Plugins/PluginSurfaceTexture.swift
      # T05 scene3d input/camera/hit components. They are pure logic shared
      # verbatim with the host; the preview app compiles them directly rather
      # than reimplementing them. Rendering wiring itself belongs to T06/T08.
      - Sources/Services/Plugins/Scene3DAccessibilityModel.swift
      - Sources/Services/Plugins/Scene3DCameraController.swift
      - Sources/Services/Plugins/Scene3DHitRouter.swift
      - Sources/Services/Plugins/Scene3DInputSession.swift
      - Sources/Services/Plugins/Scene3DPointerClassifier.swift
      # T06 scene3d asset loading, assembly and per-slot lifecycle. The preview
      # uses the same native component source as the host; no parallel renderer.
      - Sources/Services/Plugins/PluginScene3DAsset.swift
      - Sources/Services/Plugins/PluginScene3DAssetCache.swift
      - Sources/Services/Plugins/PluginScene3DAssetLoader.swift
      - Sources/Services/Plugins/PluginScene3DAssembly.swift
      - Sources/Services/Plugins/PluginScene3DController.swift
      - Sources/Services/Plugins/PluginStorage.swift
      - Sources/Utilities/AppIconCache.swift
      - Sources/Utilities/AppLogger.swift
      - Sources/Utilities/DesignTokens.swift
      - Sources/Utilities/MotionTokens.swift
      - Sources/Utilities/GlassEffect.swift
      - Sources/Utilities/NativeCrystalContainer.swift
      - Sources/Utilities/ThemeApplier.swift
      - Sources/Views/PluginSlotSurface.swift
      - Sources/Views/PluginOverlayView.swift
      - Sources/Views/PluginSceneView.swift
      - Sources/Views/PluginSceneDrawing.swift
      # T05 SceneKit adapter behind Scene3DHitProviding; geometry only, action
      # mapping stays in Scene3DHitRouter. Host and preview share this file.
      - Sources/Views/Plugins/Scene3DHitTestAdapter.swift
      # T06 SwiftUI/SCNView host for the shared scene3d component.
      - Sources/Views/Plugins/PluginScene3DView.swift
      - Sources/Views/Plugins/CoreGraphicsPluginSurfaceRasterizer.swift
      - Sources/Views/Plugins/PluginSurfaceDrawing.swift
      - Sources/Views/ThumbnailLoadState.swift
      - Sources/Views/DockWindowCard.swift
      - Tools/PluginPreview/Protocol/PluginPreviewFrameCodec.swift
      - Tools/PluginPreview/Worker/PluginPreviewWorkerProtocol.swift
      - Tools/PluginPreview/Controller/PluginPreviewPipeIO.swift
      - Tools/PluginPreview/Controller/PluginPreviewProcessTypes.swift
      - Tools/PluginPreview/Controller/PluginPreviewWorkerSupervisor.swift
      - Tools/PluginPreview/Controller/PluginPreviewSession.swift
      - Tools/PluginPreview/Scenario/PreviewScenario.swift
      - Tools/PluginPreview/Scenario/DefaultScenario.swift
      - Tools/PluginPreview/Scenario/PreviewScenarioExporter.swift
      - Tools/PluginPreview/Scenario/PluginPreviewInspect.swift
      - Tools/PluginPreview/Scenario/PluginPreviewStep.swift
      - Tools/PluginPreview/Artifacts/PluginPreviewArtifactModels.swift
      - Tools/PluginPreview/Artifacts/PluginPreviewArtifactBuilder.swift
      - Tools/PluginPreview/Artifacts/PluginPreviewPackageHasher.swift
      - Tools/PluginPreview/Artifacts/PluginPreviewArtifactWriter.swift
      - Tools/PluginPreview/Reload/PluginPreviewPackageWatcher.swift
      - Tools/PluginPreview/Entry/PreviewAppMain.swift
      - Tools/PluginPreview/Entry/PreviewCommandLine.swift
      - Tools/PluginPreview/UI
      - path: Tools/PluginPreview/Resources/Assets.xcassets
        buildPhase: resources
      # 推导场景的内置合成 fixture；App 运行时复制进会话 workRoot。
      - path: Tools/PluginPreview/Resources/PluginPreviewBuiltinMedia.json
        buildPhase: resources
      - path: Tools/PluginPreview/Resources/PluginPreviewBuiltinWeather.json
        buildPhase: resources
      - path: Resources/en.lproj
        buildPhase: resources
      - path: Resources/zh-Hans.lproj
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.switchly.pluginpreview
        PRODUCT_MODULE_NAME: SwitchlyPluginPreview
        PRODUCT_NAME: SwitchlyPluginPreview
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Switchly Plugin Preview
        ASSETCATALOG_COMPILER_APPICON_NAME: PreviewAppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_LSUIElement: YES
        CODE_SIGN_ENTITLEMENTS: ""
        SKIP_INSTALL: YES
    scheme:
      gatherCoverageData: false

  SwitchlyPluginPreviewWorker:
    type: tool
    platform: macOS
    sources:
      - Sources/Models/Plugins/PluginConsoleLine.swift
      - Sources/Models/Plugins/PluginScene3DDescriptor.swift
      - Sources/Services/Plugins/PluginSurfaceRequest.swift
      - Sources/Models/Plugins/PluginGrant.swift
      - Sources/Models/Plugins/PluginManifest.swift
      - Sources/Models/Plugins/PluginUINode.swift
      - Sources/Models/Plugins/PluginScene.swift
      - Sources/Services/Plugins/PluginRegistry.swift
      - Sources/Services/Plugins/PluginPackageValidator.swift
      - Sources/Services/Plugins/GLBPreflight.swift
      - Sources/Services/Plugins/PluginRuntime.swift
      - Sources/Models/WindowCapture.swift
      - Sources/Services/Plugins/PluginVirtualClock.swift
      - Sources/Services/Plugins/PluginFileReader.swift
      - Sources/Services/Plugins/PluginStorage.swift
      - Sources/Services/Plugins/MediaBridge.swift
      - Sources/Services/Plugins/MediaReadContext.swift
      - Sources/Services/Plugins/PluginLifetime.swift
      - Sources/Utilities/AppLogger.swift
      - Tools/PluginPreview/Protocol/PluginPreviewFrameCodec.swift
      - Tools/PluginPreview/Scenario/PreviewScenario.swift
      - Tools/PluginPreview/Scenario/PluginPreviewStep.swift
      - Tools/PluginPreview/Fixtures/PluginFixtureFileReader.swift
      - Tools/PluginPreview/Worker/PluginPreviewWorkerProtocol.swift
      - Tools/PluginPreview/Worker/PluginPreviewWorkerFixtures.swift
      - Tools/PluginPreview/Worker/PluginPreviewWorkerSession.swift
      - Tools/PluginPreview/Worker/PluginPreviewWorkerService.swift
      - Tools/PluginPreview/Entry/PreviewWorkerMain.swift
    settings:
      base:
        PRODUCT_MODULE_NAME: SwitchlyPluginPreviewWorker
        PRODUCT_NAME: SwitchlyPluginPreviewWorker
        CODE_SIGN_ENTITLEMENTS: ""
        SKIP_INSTALL: YES
    scheme:
      gatherCoverageData: false
