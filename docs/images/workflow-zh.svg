<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="380" viewBox="0 0 1440 380" role="img"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d30"/><stop offset="1" stop-color="#213e50"/></linearGradient><linearGradient id="panel" x2="0" y2="1"><stop stop-color="#34495d"/><stop offset="1" stop-color="#1c2c3d"/></linearGradient></defs><g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1440" height="380" rx="24" fill="#122235" stroke="none"/><rect x="32" y="30" width="448" height="320" rx="18" fill="#20374b" stroke="#46637a"/><text x="56" y="66" fill="#99c8e6" font-size="16" font-weight="600">01 / PREVIEW</text><rect x="58" y="94" width="120" height="85" rx="10" fill="#355a72" stroke="#8baabe"/><rect x="190" y="94" width="120" height="85" rx="10" fill="#355a72" stroke="#8baabe"/><rect x="322" y="94" width="120" height="85" rx="10" fill="#355a72" stroke="#8baabe"/><rect x="71" y="110" width="92" height="8" rx="3" fill="#acc9dc" stroke="none"/><rect x="71" y="129" width="70" height="5" rx="2" fill="#7599b1" stroke="none"/><text x="56" y="275" fill="#eaf2fb" font-size="23" font-weight="600">窗口多，也能一眼找到</text><text x="56" y="312" fill="#b6ccdc" font-size="17" font-weight="400">快捷键打开预览，搜索标题并选择。</text><rect x="504" y="30" width="448" height="320" rx="18" fill="#20374b" stroke="#46637a"/><text x="528" y="66" fill="#99c8e6" font-size="16" font-weight="600">02 / DOCK</text><rect x="607" y="94" width="238" height="74" rx="10" fill="#355a72" stroke="#8baabe"/><rect x="622" y="106" width="98" height="50" rx="6" fill="#213e53" stroke="none"/><rect x="730" y="106" width="98" height="50" rx="6" fill="#213e53" stroke="none"/><rect x="626" y="186" width="38" height="35" rx="9" fill="#3f627c" stroke="none"/><rect x="680" y="186" width="38" height="35" rx="9" fill="#7cacc4" stroke="none"/><rect x="734" y="186" width="38" height="35" rx="9" fill="#3f627c" stroke="none"/><rect x="788" y="186" width="38" height="35" rx="9" fill="#3f627c" stroke="none"/><text x="528" y="275" fill="#eaf2fb" font-size="23" font-weight="600">从熟悉的 Dock 开始</text><text x="528" y="312" fill="#b6ccdc" font-size="17" font-weight="400">悬停应用图标，查看它打开的窗口。</text><rect x="976" y="30" width="448" height="320" rx="18" fill="#20374b" stroke="#46637a"/><text x="1000" y="66" fill="#99c8e6" font-size="16" font-weight="600">03 / WORKSPACES</text><rect x="1002" y="115" width="120" height="60" rx="14" fill="#436e87" stroke="#8baabe"/><text x="1020" y="152" fill="#eaf2fb" font-size="17" font-weight="600">BUILD</text><rect x="1134" y="115" width="120" height="60" rx="14" fill="#2c4c64" stroke="#46637a"/><text x="1152" y="152" fill="#eaf2fb" font-size="17" font-weight="600">WRITE</text><rect x="1266" y="115" width="120" height="60" rx="14" fill="#2c4c64" stroke="#46637a"/><text x="1284" y="152" fill="#eaf2fb" font-size="17" font-weight="600">PLAN</text><text x="1000" y="275" fill="#eaf2fb" font-size="23" font-weight="600">让常用应用各就各位</text><text x="1000" y="312" fill="#b6ccdc" font-size="17" font-weight="400">按任务分组，为工作区设置快捷键。</text></g></svg>