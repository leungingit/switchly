name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-26
    timeout-minutes: 30
    env:
      SWITCHLY_PLUGIN_SOURCE: ${{ github.workspace }}/.build/plugin-source/dist/Plugins

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read external plugin revision
        id: plugin-lock
        run: python3 -c 'import json, os; d=json.load(open("distribution/bundled-plugins.lock.json")); print("ref=" + (d.get("sourceRevision") or ""), file=open(os.environ["GITHUB_OUTPUT"], "a"))'

      - name: 检查私有插件仓库读取凭据
        env:
          PLUGIN_SOURCE_TOKEN: ${{ secrets.SWITCHLY_PLUGINS_READ_TOKEN }}
        run: |
          if test -z "$PLUGIN_SOURCE_TOKEN"; then
            echo "::error::请配置 SWITCHLY_PLUGINS_READ_TOKEN，仅授权读取私有 switchly-plugins 仓库 Contents。默认 GITHUB_TOKEN 无法跨仓读取。"
            exit 1
          fi

      - name: Checkout external plugin source
        uses: actions/checkout@v7
        with:
          repository: leungingit/switchly-plugins
          token: ${{ secrets.SWITCHLY_PLUGINS_READ_TOKEN }}
          ref: ${{ steps.plugin-lock.outputs.ref }}
          path: .build/plugin-source
          persist-credentials: false

      - name: Build external plugin artifacts
        run: npm --prefix .build/plugin-source run build

      # Runs before anything is generated, so the "working tree is clean" check
      # reflects the committed state rather than a freshly generated project.
      - name: Pre-flight checks (verify.sh)
        run: ./verify.sh

      - name: Show toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Cache Homebrew bottles
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: ${{ runner.os }}-brew-xcodegen-v1
          restore-keys: |
            ${{ runner.os }}-brew-

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_ENV_HINTS: 1
        run: command -v xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Cache Swift Package Manager checkouts
        uses: actions/cache@v6
        with:
          path: |
            DerivedData/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('project.yml', 'Switchly.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Generate Xcode project
        run: make bootstrap

      - name: Build (Debug)
        run: make build

      - name: Run unit tests
        run: make test-unit

      - name: Guard — no build artifacts committed
        run: |
          if git ls-files --error-unmatch build/Switchly.app >/dev/null 2>&1; then
            echo "::error::build/Switchly.app is tracked; build artifacts must not be committed."
            exit 1
          fi
          if git ls-files --error-unmatch DerivedData >/dev/null 2>&1; then
            echo "::error::DerivedData is tracked; build caches must not be committed."
            exit 1
          fi
          echo "OK: no tracked build artifacts."
