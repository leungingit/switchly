name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-26
    timeout-minutes: 30
    env:
      SWITCHLY_PLUGIN_SOURCE: ${{ github.workspace }}/.build/plugin-source/dist-v2/Plugins

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read external plugin revision
        id: plugin-lock
        run: python3 -c 'import json, os; d=json.load(open("Plugins/bundled-plugins.lock.json")); print("ref=" + (d.get("sourceRevision") or ""), file=open(os.environ["GITHUB_OUTPUT"], "a"))'

      - name: 检查私有插件仓库读取凭据
        env:
          PLUGIN_SOURCE_TOKEN: ${{ secrets.SWITCHLY_PLUGINS_READ_TOKEN }}
        run: |
          if test -z "$PLUGIN_SOURCE_TOKEN"; then
            echo "::error::请配置 SWITCHLY_PLUGINS_READ_TOKEN，仅授权读取私有 switchly-plugins 仓库 Contents。默认 GITHUB_TOKEN 无法跨仓读取。"
            exit 1
          fi

      - name: Checkout external plugin source
        uses: actions/checkout@v7
        with:
          repository: leungingit/switchly-plugins
          token: ${{ secrets.SWITCHLY_PLUGINS_READ_TOKEN }}
          ref: ${{ steps.plugin-lock.outputs.ref }}
          path: .build/plugin-source
          persist-credentials: false

      - name: Prepare plugin validator (offline CLI package)
        run: |
          pack_dir="$RUNNER_TEMP/plugin-cli-pack"
          mkdir -p "$pack_dir"
          (cd Plugins/cli && npm pack --pack-destination "$pack_dir")
          npm --prefix .build/plugin-source run validator:prepare -- "$pack_dir"/switchly-plugin-cli-*.tgz

      - name: Build external plugin artifacts
        run: npm --prefix .build/plugin-source run build

      # Runs before anything is generated, so the "working tree is clean" check
      # reflects the committed state rather than a freshly generated project.
      - name: Pre-flight checks (verify.sh)
        run: ./verify.sh

      - name: Show toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Cache Homebrew bottles
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: ${{ runner.os }}-brew-xcodegen-v1
          restore-keys: |
            ${{ runner.os }}-brew-

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_ENV_HINTS: 1
        run: command -v xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Cache Swift Package Manager checkouts
        uses: actions/cache@v6
        with:
          path: |
            DerivedData/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('project.yml', 'Switchly.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Generate Xcode project
        run: make bootstrap

      - name: Build (Debug)
        run: make build

      - name: Run unit tests
        run: make test-unit

      - name: Guard — no build artifacts committed
        run: |
          if git ls-files --error-unmatch build/Switchly.app >/dev/null 2>&1; then
            echo "::error::build/Switchly.app is tracked; build artifacts must not be committed."
            exit 1
          fi
          if git ls-files --error-unmatch DerivedData >/dev/null 2>&1; then
            echo "::error::DerivedData is tracked; build caches must not be committed."
            exit 1
          fi
          echo "OK: no tracked build artifacts."

  # ── 插件独立预览：分层验证（T19）──────────────────────────────────────
  # 第 1 层：Node 静态与业务。无需 macOS、无需外仓凭据、完全离线。
  preview-static:
    name: Preview — static & Node (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Contract hash, renderer revision and shared-source guard
        run: |
          ./Tools/PluginPreview/contract-hash.sh --check
          ./Tools/PluginPreview/renderer-revision.sh --check
          ./Tools/PluginPreview/shared-source-check.sh

      - name: plugin-cli tests
        run: |
          node --version
          npm --prefix Plugins/cli test

  # 第 2 层：macOS 上的 JavaScriptCore 与协议测试。不需要图形会话。
  preview-jsc:
    name: Preview — JSC & protocol (macOS)
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Preview unit tests (swiftc harnesses)
        run: |
          failed=0
          for script in \
            Tools/PluginPreview/Protocol/run-tests.sh \
            Tools/PluginPreview/Scenario/run-tests.sh \
            Tools/PluginPreview/Artifacts/run-tests.sh \
            Tools/PluginPreview/Reload/run-tests.sh \
            Tools/PluginPreview/Worker/Tests/run-tests.sh \
            Tests/PluginPreview/run-session-tests.sh \
            Tests/PluginPreview/run-process-supervisor-tests.sh; do
            echo "::group::$script"
            bash "$script" || { echo "::error::$script failed"; failed=1; }
            echo "::endgroup::"
          done
          exit "$failed"

  # 第 3 层：需要图形会话与屏幕录制授权的视觉/输入回归与工具包验收。
  # GitHub 托管 runner 没有屏幕录制授权，因此只在仓库变量 PREVIEW_GUI_RUNNER 指定了
  # 带授权的 runner 标签时运行；未配置时该 job 显示为「跳过」，而不是绿灯。
  # 脚本在环境不可用时退出 77，这里按失败处理，不会把「没跑」当成「通过」。
  preview-gui:
    name: Preview — GUI regression & toolkit
    if: ${{ vars.PREVIEW_GUI_RUNNER != '' }}
    runs-on: ${{ vars.PREVIEW_GUI_RUNNER }}
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_ENV_HINTS: 1
        run: command -v xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Build preview app and worker
        run: make plugin-preview-build

      - name: Native input, visual baseline, dev lifecycle
        run: |
          ./Tests/PluginPreview/run-native-input-tests.sh
          ./Tests/PluginPreview/run-baseline-tests.sh
          ./Tests/PluginPreview/run-dev-lifecycle-tests.sh
          ./Tests/PluginPreview/run-failure-modes-tests.sh

      - name: Package toolkit, run the clean-environment acceptance and the documented commands
        run: make plugin-preview-toolkit-test

      - name: Upload toolkit
        uses: actions/upload-artifact@v7
        with:
          name: switchly-plugin-preview-toolkit
          path: |
            DerivedData/PluginPreviewRelease/toolkit/*.tar.gz
            DerivedData/PluginPreviewRelease/toolkit/*.tar.gz.sha256
          if-no-files-found: error
