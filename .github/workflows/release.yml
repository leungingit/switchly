name: Release

on:
  push:
    # A glob, not a regex. Accept any v-prefixed tag here and let the strict
    # semver check in the first step reject anything that is not vX.Y.Z.
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v1.0.0)"
        required: true
        type: string
      dry_run:
        description: "Build and package without publishing a Release"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, package & publish
    runs-on: macos-26
    timeout-minutes: 45

    permissions:
      contents: write # required to create the GitHub Release and upload assets

    env:
      SWITCHLY_PLUGIN_SOURCE: ${{ github.workspace }}/.build/plugin-source/dist/Plugins
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Optional signing / notarization credentials. With none of them set the
      # job publishes an ad-hoc, unnotarized build. A partially configured set
      # (certificate but no Apple ID) is rejected — see "Check notarization
      # credentials" below.
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

    steps:
      - name: Resolve release tag
        id: meta
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::Tag '$TAG' is not a semver tag (expected vX.Y.Z)."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.meta.outputs.tag }}
          fetch-depth: 0

      - name: Read external plugin revision
        id: plugin-lock
        run: python3 -c 'import json, os; d=json.load(open("Plugins/bundled-plugins.lock.json")); print("ref=" + (d.get("sourceRevision") or ""), file=open(os.environ["GITHUB_OUTPUT"], "a"))'

      - name: 检查私有插件仓库读取凭据
        env:
          PLUGIN_SOURCE_TOKEN: ${{ secrets.SWITCHLY_PLUGINS_READ_TOKEN }}
        run: |
          if test -z "$PLUGIN_SOURCE_TOKEN"; then
            echo "::error::请配置 SWITCHLY_PLUGINS_READ_TOKEN，仅授权读取私有 switchly-plugins 仓库 Contents。默认 GITHUB_TOKEN 无法跨仓读取。"
            exit 1
          fi

      - name: Checkout external plugin source
        uses: actions/checkout@v7
        with:
          repository: leungingit/switchly-plugins
          token: ${{ secrets.SWITCHLY_PLUGINS_READ_TOKEN }}
          ref: ${{ steps.plugin-lock.outputs.ref }}
          path: .build/plugin-source
          persist-credentials: false

      - name: Prepare plugin validator (offline CLI package)
        run: |
          pack_dir="$RUNNER_TEMP/plugin-cli-pack"
          mkdir -p "$pack_dir"
          (cd Plugins/cli && npm pack --pack-destination "$pack_dir")
          npm --prefix .build/plugin-source run validator:prepare -- "$pack_dir"/switchly-plugin-cli-*.tgz

      - name: Build external plugin artifacts
        run: npm --prefix .build/plugin-source run build

      # Last chance to catch a leaked credential or a stray build artifact
      # before the assets become public. --release also makes a missing
      # CHANGELOG section for this version a hard failure, so a tag cannot
      # publish with empty release notes.
      - name: Pre-flight checks (verify.sh --release)
        run: ./verify.sh --release

      - name: Cache Homebrew bottles
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: ${{ runner.os }}-brew-xcodegen-v1
          restore-keys: |
            ${{ runner.os }}-brew-

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_ENV_HINTS: 1
        run: command -v xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Verify Info.plist version matches the tag
        env:
          TAG_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          PLIST_VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)"
          echo "Info.plist=$PLIST_VERSION  tag=$TAG_VERSION"
          if [ "$PLIST_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::CFBundleShortVersionString ($PLIST_VERSION) does not match tag ($TAG_VERSION). Bump it first."
            exit 1
          fi

      - name: Generate Xcode project
        run: make bootstrap

      # Gate the release on the test suite: CI already ran on the branch, but
      # this is the commit that actually ships, so verify it here too.
      - name: Run unit tests
        run: make test-unit

      - name: Import signing certificate
        id: signing
        if: env.BUILD_CERTIFICATE_BASE64 != ''
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity in the imported certificate."
            exit 1
          fi
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # A Developer ID signed build that is *not* notarized is worse than an
      # ad-hoc one: Gatekeeper still blocks it, but it no longer looks like an
      # unsigned local build. Fail before the expensive build rather than
      # silently skipping notarization. APPLE_* come from the job-level env.
      - name: Check notarization credentials
        if: steps.signing.outputs.signed == 'true'
        run: |
          set -euo pipefail
          MISSING=""
          [ -n "$APPLE_ID" ] || MISSING="$MISSING APPLE_ID"
          [ -n "$APPLE_TEAM_ID" ] || MISSING="$MISSING APPLE_TEAM_ID"
          [ -n "$APPLE_APP_PASSWORD" ] || MISSING="$MISSING APPLE_APP_PASSWORD"
          if [ -n "$MISSING" ]; then
            echo "::error::BUILD_CERTIFICATE_BASE64 is set but these secrets are missing:$MISSING"
            echo "::error::Configure APPLE_ID, APPLE_TEAM_ID and APPLE_APP_PASSWORD too, or remove BUILD_CERTIFICATE_BASE64 to fall back to ad-hoc signing."
            exit 1
          fi

      - name: Build Release
        env:
          SIGN_IDENTITY: ${{ steps.signing.outputs.identity || '-' }}
        run: |
          set -euo pipefail
          make dist SIGN_IDENTITY="$SIGN_IDENTITY"
          Scripts/xcodebuild-no-warnings.sh -project Switchly.xcodeproj \
            -scheme SwitchlyPluginPreview -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath DerivedData/PluginPreview \
            CODE_SIGN_IDENTITY="$SIGN_IDENTITY" -quiet build
          ditto DerivedData/PluginPreview/Build/Products/Release/SwitchlyPluginPreview.app build/SwitchlyPluginPreview.app
          test -x build/SwitchlyPluginPreview.app/Contents/MacOS/SwitchlyPluginPreviewWorker
          codesign --verify --deep --strict build/SwitchlyPluginPreview.app

      - name: Notarize
        id: notarize
        if: steps.signing.outputs.signed == 'true'
        run: |
          set -euo pipefail
          for app in Switchly SwitchlyPluginPreview; do
            ditto -c -k --keepParent "build/$app.app" build/notarize.zip
            xcrun notarytool submit build/notarize.zip \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --wait
            xcrun stapler staple "build/$app.app"
            rm -f build/notarize.zip
          done
          echo "notarized=true" >> "$GITHUB_OUTPUT"

      - name: Package zip & checksum
        id: package
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          ASSET="Switchly-${VERSION}.zip"
          ditto -c -k --keepParent build/Switchly.app "build/$ASSET"
          (cd build && shasum -a 256 "$ASSET" > "$ASSET.sha256")
          echo "asset=build/$ASSET" >> "$GITHUB_OUTPUT"
          echo "sum=build/$ASSET.sha256" >> "$GITHUB_OUTPUT"
          PREVIEW_ASSET="SwitchlyPluginPreview-${VERSION}.zip"
          ditto -c -k --keepParent build/SwitchlyPluginPreview.app "build/$PREVIEW_ASSET"
          (cd build && shasum -a 256 "$PREVIEW_ASSET" > "$PREVIEW_ASSET.sha256")
          echo "preview_asset=build/$PREVIEW_ASSET" >> "$GITHUB_OUTPUT"
          echo "preview_sum=build/$PREVIEW_ASSET.sha256" >> "$GITHUB_OUTPUT"
          ls -lh "build/$ASSET" "build/$ASSET.sha256"
          ls -lh "build/$PREVIEW_ASSET" "build/$PREVIEW_ASSET.sha256"

      - name: Report code signature
        run: |
          codesign --display --verbose=4 build/Switchly.app || true
          spctl --assess --type execute --verbose=4 build/Switchly.app || true

      - name: Compose release notes
        id: notes
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          NOTARIZED: ${{ steps.notarize.outputs.notarized }}
        run: |
          set -euo pipefail
          NOTES=release_notes.md
          : > "$NOTES"
          if [ -f CHANGELOG.md ]; then
            awk -v v="$VERSION" -v t="$TAG" '
              index($0, "## [" v "]") == 1 || index($0, "## [" t "]") == 1 { found = 1; next }
              found && index($0, "## ") == 1 { exit }
              found && $0 ~ /^\[[^]]+\]: / { exit }
              found { print }
            ' CHANGELOG.md > "$NOTES"
          fi
          if [ ! -s "$NOTES" ]; then
            printf 'Release %s.\n' "$TAG" > "$NOTES"
          fi
          if [ "$NOTARIZED" != "true" ]; then
            {
              printf '\n---\n\n'
              printf '> **Note:** this build is **ad-hoc signed and not notarized**.\n'
              printf '> macOS Gatekeeper will warn on first launch. To open it, right-click the\n'
              printf '> app and choose *Open*, or run:\n>\n'
              printf '> ```sh\n> xattr -dr com.apple.quarantine /Applications/Switchly.app\n> ```\n>\n'
              printf '> 对预览 App，请将上述路径替换为 `/Applications/SwitchlyPluginPreview.app`。\n>\n'
              printf '> Verify the download with:\n>\n'
              printf '> ```sh\n> shasum -a 256 -c Switchly-*.zip.sha256\n> ```\n'
            } >> "$NOTES"
          fi
          echo "----- release notes -----"
          cat "$NOTES"

      - name: Publish GitHub Release
        # A workflow_dispatch dry run stops here. Every step above has run,
        # so the pipeline can be exercised without publishing a Release.
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          ASSET: ${{ steps.package.outputs.asset }}
          SUM: ${{ steps.package.outputs.sum }}
          PREVIEW_ASSET: ${{ steps.package.outputs.preview_asset }}
          PREVIEW_SUM: ${{ steps.package.outputs.preview_sum }}
        run: |
          set -euo pipefail
          FLAGS=(--title "$TAG" --notes-file release_notes.md --verify-tag)
          case "$TAG" in
            *-*) FLAGS+=(--prerelease) ;;
          esac
          gh release create "$TAG" "$ASSET" "$SUM" "$PREVIEW_ASSET" "$PREVIEW_SUM" "${FLAGS[@]}"

      - name: Clean up keychain
        if: always() && steps.signing.outputs.signed == 'true'
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
