name: Feature request
description: Suggest an idea or an improvement
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make Switchly better. Please describe the problem you
        are trying to solve, not only the solution you have in mind — that leaves
        room for a better approach.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the friction you hit today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: Which part of the app does this touch?
      multiple: true
      options:
        - Global shortcuts
        - Preview panel
        - Dock hover / workspace bar
        - Preferences
        - Permissions / onboarding
        - Build system / tooling
        - Other

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this.
          required: false
