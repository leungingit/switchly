name: Bug report
description: Report something that does not work as expected
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report.

        Before you continue, please check that the issue is not already covered by
        an existing report, and that you are running the latest release.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I am running the latest release (or built from `main`).
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Press the global shortcut ...
        2. Hover the Dock icon of ...
        3. Click the preview card for ...
    validations:
      required: true

  - type: input
    id: switchly-version
    attributes:
      label: Switchly version
      description: Found in the menu-bar menu, or from `make version`.
      placeholder: "1.0.0 (build 1)"
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS version
      description: "`sw_vers -productVersion`, or Apple menu → About This Mac."
      placeholder: "14.5"
    validations:
      required: true

  - type: dropdown
    id: chip
    attributes:
      label: Mac architecture
      options:
        - Apple silicon (arm64)
        - Intel (x86_64)
    validations:
      required: true

  - type: dropdown
    id: permissions
    attributes:
      label: Which permissions have been granted?
      multiple: true
      options:
        - Accessibility
        - Screen Recording
        - None

  - type: textarea
    id: apps-affected
    attributes:
      label: Which app(s) does it affect?
      description: |
        Window switching behaves differently across apps, so naming them helps a lot.
        If a specific app is involved, please also paste the window titles you see.
      placeholder: "Chrome, Feishu, PyCharm, ..."
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: |
        Attach the tail of `~/Library/Logs/Switchly/Switchly.log` if the app logged
        anything. **Review the file before posting** — it records app names and
        window titles from your machine.
      render: shell
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recordings
      description: Drag and drop here. Blur anything private.
    validations:
      required: false
